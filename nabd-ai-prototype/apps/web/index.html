<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content-Security-Policy is also set by the API for its own responses. This meta policy
      covers the static bundle: no inline script, no external connection other than the
      same-origin API, and no framing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>NABD AI Decision Review</title>
    <meta
      name="description"
      content="Isolated synthetic prototype. Decision-support only: it does not approve, execute, transmit or activate any institutional action."
    />
    <!--
      UI fonts only. This is the single external request the interface makes, and it fetches
      typefaces, never data. Self-host these files for an air-gapped deployment.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Mono:wght@400&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
